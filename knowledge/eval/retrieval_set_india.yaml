# Retrieval queries for the Phase 4 drugs (production plan). Same format as retrieval_set.yaml, read after it.
# Positives name a well-known label topic for the drug. Negatives are common Indian drugs with no US label: the right answer is
# an honest gap, never a nearby drug's text.
queries:
  # Section lookups ------------------------------------------------------------------------------------
  - {kind: section, q: sitagliptin pancreatitis, drug: Sitagliptin}
  - {kind: section, q: empagliflozin ketoacidosis, drug: Empagliflozin}
  - {kind: section, q: dapagliflozin volume depletion hypotension, drug: Dapagliflozin}
  - {kind: section, q: pioglitazone congestive heart failure, drug: Pioglitazone hydrochloride}
  - {kind: section, q: olmesartan fetal toxicity pregnancy, drug: Olmesartan medoxomil}
  - {kind: section, q: ramipril angioedema, drug: Ramipril}
  - {kind: section, q: enalapril fetal toxicity, drug: Enalapril maleate}
  - {kind: section, q: atenolol abrupt cessation ischemic heart disease, drug: Atenolol}
  - {kind: section, q: bisoprolol bradycardia heart block, drug: Bisoprolol fumarate}
  - {kind: section, q: chlorthalidone electrolyte imbalance, drug: Chlorthalidone}
