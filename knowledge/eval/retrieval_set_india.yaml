  - {kind: section, q: escitalopram suicidal thoughts, drug: Escitalopram oxalate}
  - {kind: section, q: sertraline serotonin syndrome, drug: Sertraline hydrochloride}
  - {kind: section, q: gabapentin respiratory depression, drug: Gabapentin}
  - {kind: section, q: prednisolone adrenal suppression, drug: Prednisolone}
  - {kind: section, q: methotrexate embryo-fetal toxicity, drug: Methotrexate}
  - {kind: section, q: alprazolam concomitant opioids, drug: Alprazolam}
  - {kind: section, q: amitriptyline suicidality antidepressants, drug: Amitriptyline hydrochloride}
