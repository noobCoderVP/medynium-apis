# Phase 4 of the production plan: the drugs prescribed most in India. Read after drugs.yaml, so the first 25 keep their ids.
#
# Selection rule: on India's National List of Essential Medicines (NLEM 2022) or among the most-prescribed brands, AND a
# US label exists on openFDA. A reviewer should confirm this list; it is a proposal, not a ranking by prescribing volume.
#   nlem      set only where the drug is certain to be on NLEM 2022. Verify against the NLEM PDF before relying on it.
#   otc       has a Drug Facts label (different sections from a prescription label).
#   brands    well-known Indian brand names added by hand (source MANUAL, for clinical review). The A-Z India dataset that fed
#             the first 100 brands is not in this repository, so these are not generated from it.
#   no_label  common in India but with no US prescription label. It is listed so a search says "not indexed" and a medicine
#             on the patient's list shows the same honest gap, instead of a guess. Indian prescribing information from a
#             manufacturer or CDSCO would be the source to add (needs approval).
# openFDA is a US source: every citation says so, and Indian labelling may differ.
drugs:
  - {code: GLZ, name: Gliclazide, openfda: [GLICLAZIDE], aliases: [gliclazide], nlem: true, brands: [diamicron, glizid, reclide], no_label: true}
